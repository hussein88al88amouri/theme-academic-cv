backend:
  name: github
  repo: hussein88al88amouri/theme-academic-cv
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: hussein-el-amouri.netlify.app
site_url: https://hussein-el-amouri.netlify.app
display_url: https://hussein-el-amouri.netlify.app
logo_url: /admin/logo.svg
publish_mode: editorial_workflow
media_folder: static/uploads
public_folder: /uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: website
  label: Homepage & career
  description: Edit the homepage, CV, experience, teaching, supervision, and contact details.
  files:
  - name: homepage
    label: Homepage & career
    file: data/portfolio.yaml
    fields:
    - name: eyebrow
      label: Research topics above headline
      widget: string
    - name: headline
      label: Homepage headline
      widget: string
    - name: intro
      label: Homepage introduction
      widget: text
    - name: availability
      label: Collaboration availability
      widget: text
    - name: cv_url
      label: CV PDF
      widget: file
      media_folder: /static/uploads/helamouri
      public_folder: /uploads/helamouri
      hint: Upload a PDF or select one from the media library. This updates the CV link throughout the site.
      allow_multiple: false
    - name: research_heading
      label: Research Heading
      widget: string
    - name: research_intro
      label: Research Intro
      widget: text
    - name: experience
      label: Experience
      widget: list
      fields:
      - name: title
        label: Title
        widget: string
      - name: organization
        label: Organization
        widget: string
      - name: location
        label: Location
        widget: string
      - name: period
        label: Dates (for example September 2025–present)
        widget: string
      - name: description
        label: Description
        widget: text
    - name: teaching_intro
      label: Teaching Intro
      widget: text
    - name: courses
      label: Courses
      widget: list
      field:
        name: value
        label: Value
        widget: string
    - name: supervision
      label: Supervision
      widget: list
      fields:
      - name: title
        label: Project title
        widget: string
      - name: institution
        label: Institution
        widget: string
      - name: period
        label: Period
        widget: string
      - name: status
        label: Status
        widget: select
        options:
        - Ongoing
        - Completed
      - name: description
        label: Description
        widget: text
    - name: writing_intro
      label: Writing Intro
      widget: text
    - name: medium_url
      label: Medium profile URL
      widget: string
      required: false
      hint: Leave empty until you have a public Medium profile. Use a full https:// URL.
    - name: contact_heading
      label: Contact Heading
      widget: string
    - name: contact_text
      label: Contact Text
      widget: text
    - name: email
      label: Contact email
      widget: string
      pattern:
      - ^[^\s@]+@[^\s@]+\.[^\s@]+$
      - Enter a valid email address
    - name: contact_form
      label: Show contact form
      widget: boolean
      default: true
    - name: about_heading
      label: About section heading
      widget: string
    - name: portrait_crop
      label: Portrait proportions
      widget: select
      options:
      - label: Original proportions
        value: natural
      - label: Square crop
        value: square
      - label: Circular portrait
        value: circle
      default: circle
    - name: portrait_caption
      label: Portrait caption
      widget: string
      required: false
      hint: Leave blank to hide the caption.
    - name: writing_linkedin_url
      label: LinkedIn writing profile
      widget: string
      required: false
    - name: contact_submit_url
      label: Contact form submission URL
      widget: string
      hint: Use the primary Netlify URL followed by /.netlify/functions/contact. Brevo API key and verified sender must be configured securely in Netlify.
    - name: primary_site_url
      label: Primary website address
      widget: string
      hint: Keep the existing Netlify address as the primary website, including the trailing slash.
    - name: navigation
      label: Navigation menu
      widget: list
      fields:
      - name: label
        label: Menu text
        widget: string
      - name: url
        label: Destination
        widget: string
        hint: 'Use #about, #research, #publications, #experience, #notes, #contact, or a full website URL.'
    - name: ui
      label: All headings, buttons, labels and messages
      widget: object
      collapsed: true
      fields:
      - name: skip_link
        label: Skip Link
        widget: string
      - name: menu
        label: Menu
        widget: string
      - name: brand_mark
        label: Brand Mark
        widget: string
      - name: cv_label
        label: Cv Label
        widget: string
      - name: hero_research_button
        label: Hero Research Button
        widget: string
      - name: hero_cv_button
        label: Hero Cv Button
        widget: string
      - name: scroll_hint
        label: Scroll Hint
        widget: string
      - name: about_kicker
        label: About Kicker
        widget: string
      - name: research_kicker
        label: Research Kicker
        widget: string
      - name: publications_kicker
        label: Publications Kicker
        widget: string
      - name: experience_kicker
        label: Experience Kicker
        widget: string
      - name: teaching_kicker
        label: Teaching Kicker
        widget: string
      - name: notes_kicker
        label: Notes Kicker
        widget: string
      - name: contact_kicker
        label: Contact Kicker
        widget: string
      - name: interests_heading
        label: Interests Heading
        widget: string
      - name: publications_heading
        label: Publications Heading
        widget: string
      - name: publications_archive
        label: Publications Archive
        widget: string
      - name: search_label
        label: Search Label
        widget: string
      - name: search_placeholder
        label: Search Placeholder
        widget: string
      - name: year_label
        label: Year Label
        widget: string
      - name: all_years
        label: All Years
        widget: string
      - name: publication_count
        label: Publication Count
        widget: string
      - name: publication_empty
        label: Publication Empty
        widget: string
      - name: experience_heading
        label: Experience Heading
        widget: string
      - name: education_heading
        label: Education Heading
        widget: string
      - name: tools_heading
        label: Tools Heading
        widget: string
      - name: teaching_heading
        label: Teaching Heading
        widget: string
      - name: courses_heading
        label: Courses Heading
        widget: string
      - name: notes_heading
        label: Notes Heading
        widget: string
      - name: linkedin_writing
        label: Linkedin Writing
        widget: string
      - name: medium_writing
        label: Medium Writing
        widget: string
      - name: external_essay
        label: External Essay
        widget: string
      - name: read_note
        label: Read Note
        widget: string
      - name: notes_archive
        label: Notes Archive
        widget: string
      - name: notes_empty
        label: Notes Empty
        widget: string
      - name: contact_name
        label: Contact Name
        widget: string
      - name: contact_email
        label: Contact Email
        widget: string
      - name: contact_subject
        label: Contact Subject
        widget: string
      - name: contact_message
        label: Contact Message
        widget: string
      - name: contact_button
