        widget: string
      - name: cv_open
        label: Cv Open
        widget: string
      - name: return_website
        label: Return Website
        widget: string
    - name: appearance
      label: Colors and homepage text sizes
      widget: object
      collapsed: true
      fields:
      - name: headline_size
        label: Maximum headline size (px)
        widget: number
        value_type: float
        min: 12
        max: 80
      - name: role_size
        label: Role / affiliation size (px)
        widget: number
        value_type: float
        min: 12
        max: 80
      - name: intro_size
        label: Introduction size (px)
        widget: number
        value_type: float
        min: 12
        max: 80
      - name: accent_color
        label: Accent color
        widget: color
      - name: background_color
        label: Background color
        widget: color
- name: profile
  label: Biography & education
  files:
  - name: hussein
    label: Hussein El Amouri
    file: content/authors/helamouri/_index.md
    fields:
    - name: title
      label: Display name
      widget: string
    - name: first_name
      label: First Name
      widget: string
    - name: last_name
      label: Last Name
      widget: string
    - name: role
      label: Role / tagline
      widget: string
    - name: avatar
      label: Portrait photo
      widget: image
      required: false
      media_folder: /static/uploads/helamouri
      public_folder: /uploads/helamouri
      hint: Upload a portrait or leave blank to use the existing photograph.
    - name: bio
      label: Short bio
      widget: text
      required: false
    - name: superuser
      label: Superuser
      widget: hidden
      default: true
    - name: organizations
      label: Organizations
      widget: list
      fields:
      - name: name
        label: Name
        widget: string
      - name: url
        label: Website
        widget: string
        required: false
    - name: interests
      label: Interests
      widget: list
      field:
        name: value
        label: Value
        widget: string
    - name: education
      label: Education
      widget: object
      fields:
      - name: courses
        label: Courses
        widget: list
        fields:
        - name: course
          label: Degree
          widget: string
        - name: institution
          label: Institution
          widget: string
        - name: year
          label: Year
          widget: number
          value_type: int
    - name: skills
      label: Skills
      widget: list
      fields:
      - name: name
        label: Category
        widget: string
      - name: items
        label: Items
        widget: list
        fields:
        - name: name
          label: Tools / skills
          widget: string
    - name: social
      label: Social
      widget: list
      fields:
      - name: icon
        label: Icon
        widget: select
        options:
        - envelope
        - graduation-cap
        - github
        - linkedin
        - cv
        - medium
        - orcid
        - website
        - link
      - name: icon_pack
        label: Icon pack
        widget: select
        options:
        - fas
        - fab
        - ai
      - name: link
        label: Link
        widget: string
      - name: label
        label: Link label
        widget: string
        required: false
    - name: body
      label: Full biography
      widget: markdown
- name: publication
  label: Publications
  folder: content/publication
  create: true
  delete: true
  path: '{{slug}}/index'
  format: yaml-frontmatter
  extension: md
  slug: '{{slug}}'
  preview_path: publication/{{slug}}/
  fields:
  - &id001
    name: title
    label: Title
    widget: string
  - &id002
    name: date
    label: Date
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  - &id003
    name: draft
    label: Hide from public site
    widget: boolean
    required: false
    default: false
    hint: Enable only to keep an entry hidden even after publishing it through the editor.
  - &id004
    name: summary
    label: Short description
    widget: text
    required: false
  - &id005
    name: tags
    label: Topics
    widget: list
    required: false
  - name: publication
    label: Journal / conference
    widget: string
  - name: publication_types
    label: Publication type
    widget: select
    multiple: true
    options:
    - label: Journal article
      value: article-journal
    - label: Conference paper
      value: paper-conference
    - label: Preprint / working paper
      value: manuscript
    - label: Thesis
      value: thesis
  - name: date_precision
    label: Date accuracy
    widget: select
    required: false
    options:
    - day
    - year
    default: day
    hint: Select year if only the publication year is known.
  - name: authors
    label: Authors
    widget: list
    required: false
    hint: Enter the names as they appear on the paper; do not guess missing authors.
  - name: doi
    label: DOI
    widget: string
    required: false
    hint: For example 10.1016/j.patcog.2023.109804; a DOI URL also works.
  - name: abstract
    label: Abstract
    widget: text
    required: false
  - name: featured
    label: Featured
    widget: boolean
    required: false
    default: false
  - name: url_pdf
    label: PDF link
    widget: string
    required: false
  - name: url_code
    label: Code link
    widget: string
    required: false
  - name: url_dataset
    label: Dataset link
    widget: string
    required: false
  - name: url_project
    label: Project link
    widget: string
    required: false
  - name: url_video
    label: Video link
    widget: string
    required: false
  - name: url_slides
    label: Slides link
    widget: string
    required: false
  - &id006
    name: body
    label: Main text
    widget: markdown
    required: false
  summary: '{{title}}'
- name: project
  label: Research projects
  folder: content/project
  create: true
  delete: true
  path: '{{slug}}/index'
  format: yaml-frontmatter
  extension: md
  slug: '{{slug}}'
  preview_path: project/{{slug}}/
  fields:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - name: status
    label: Research status
    widget: select
    options:
    - Ongoing research
    - Manuscript under revision
    - Published research
    - Completed project
  - name: url_code
    label: Code link
    widget: string
    required: false
  - name: external_link
    label: External project URL
    widget: string
    required: false
  - *id006
  - name: figure
    label: Conceptual figure
    widget: image
    required: false
    hint: Use diagram.svg for the bundled figure, or upload a replacement. SVG, PNG, and JPG are supported.
  - name: figure_alt
    label: Figure description for accessibility
    widget: text
    required: false
  - name: figure_caption
    label: Figure caption
    widget: text
    required: false
  summary: '{{title}}'
  media_folder: ''
  public_folder: ''
- name: post
  label: Notes & ideas
  folder: content/post
  create: true
  delete: true
  path: '{{slug}}/index'
  format: yaml-frontmatter
  extension: md
  slug: '{{slug}}'
  preview_path: post/{{slug}}/
  fields:
  - *id001
  - *id002
  - *id003
  - *id004
  - *id005
  - name: external_link
    label: Medium / external article URL
    widget: string
    required: false
    hint: Leave blank for a post hosted here. For Medium, add its full https:// URL; the homepage and notes archive link to it directly.
  - *id006
  summary: '{{title}}'
- name: pages
  label: Additional pages
  folder: content/page
  create: true
  path: '{{slug}}/index'
  format: yaml-frontmatter
  extension: md
  fields:
  - name: title
    label: Page title
    widget: string
  - name: summary
    label: Description
    widget: text
    required: false
  - name: draft
    label: Hide from public site
    widget: boolean
    default: false
    required: false
  - name: body
    label: Page content
    widget: markdown
  hint: Add pages here, then add their /page/<slug>/ address to the navigation menu.
- name: page_headings
  label: Archive & thank-you pages
  files:
  - name: publications
    label: Publications archive
    file: content/publication/_index.md
    fields:
    - name: title
      label: Title
      widget: string
    - name: body
      label: Text
      widget: markdown
      required: false
  - name: notes
    label: Notes archive
    file: content/post/_index.md
    fields:
    - name: title
      label: Title
      widget: string
    - name: body
      label: Text
      widget: markdown
      required: false
  - name: thanks
    label: Thank-you page
    file: content/contact/thanks.md
    fields:
    - name: title
      label: Title
      widget: string
    - name: body
      label: Text
      widget: markdown
      required: false
