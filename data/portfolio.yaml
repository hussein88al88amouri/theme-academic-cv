experience:
  - title: Assistant Professor & Researcher
    organization: University of Sciences and Arts in Lebanon (USAL)
    location: Lebanon
    period: September 2025–present
    description: Teaching data structures, advanced data structures, introductory
      Java programming, and networks. Research on constrained clustering quality
      and diffusion-based learning for seizure detection.
  - title: Research Assistant
    organization: ICube Laboratory, University of Strasbourg
    location: France
    period: 2023–2025
    description: Active learning for incremental constrained clustering of
      time-series and remote-sensing data, building on CDPS and SCE.
  - title: PhD Researcher
    organization: ICube Laboratory, University of Strasbourg
    location: France
    period: 2020–2023
    description: Interpretable time-series representations integrating expert
      knowledge for clustering, using shapelets, contrastive learning, and
      Siamese networks.
  - title: Lecturer
    organization: University of Strasbourg
    location: France
    period: 2020–2024
    description: Linux tools and scripting; reading and discussing computer science
      research in English; coaching an AI hackathon.
  - title: Research Intern · Speech Synthesis
    organization: GIPSA-LAB, Grenoble
    location: France
    period: "2020"
    description: Benchmarking how autoregressive, source-filter, flow, and GAN
      vocoders extrapolate to unseen pitch values.
  - title: Telecommunication Engineering Intern
    organization: Ogero Center, Beirut
    location: Lebanon
    period: "2019"
    description: Telecommunication architecture and protocols.
