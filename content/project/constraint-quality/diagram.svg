<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc"><title id="title">Which constraints are beneficial?</title><desc id="desc">Ongoing research examines criteria for assessing the quality and potential benefit of clustering constraints. The diagram poses the research question; it does not claim an established answer.</desc><rect width="1000" height="365" rx="16" fill="#111c27"/><g font-family="system-ui,sans-serif"><text x="30" y="35" fill="#83dcc8" font-size="14" letter-spacing="2">CONCEPTUAL OVERVIEW</text><rect x="30" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(45,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><path d="M45 35 115 70 195 35 M45 105 115 70 195 105"/><circle cx="45" cy="35" r="10" fill="#182632"/><circle cx="45" cy="105" r="10" fill="#182632"/><circle cx="115" cy="70" r="10" fill="#182632"/><circle cx="195" cy="35" r="10" fill="#182632"/><circle cx="195" cy="105" r="10" fill="#182632"/></g><text x="165" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Candidate constraints</text><text x="165" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Relations between samples</text><path d="M312 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="365" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(380,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><rect x="40" y="20" width="160" height="100" rx="10"/><path d="m60 43 7 7 12-16 M94 42h80 m-114 26 7 7 12-16 M94 67h80 m-114 26 7 7 12-16 M94 92h80"/></g><text x="500" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Examine quality criteria</text><text x="500" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Investigate existing limitations</text><path d="M647 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="700" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(715,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><text x="120" y="102" text-anchor="middle" font-size="100" fill="#83dcc8" stroke="none">?</text></g><text x="835" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Assess potential benefit</text><text x="835" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Which constraints help?</text><text x="30" y="343" fill="#a6b5c2" font-size="13">Illustrative schematic — not experimental results or a validated model architecture.</text></g></svg>
