<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc"><title id="title">Constrained DTW Preserving Shapelets</title><desc id="desc">Time-series data and expert pairwise constraints inform a DTW-preserving shapelet representation, which is used for clustering.</desc><rect width="1000" height="365" rx="16" fill="#111c27"/><g font-family="system-ui,sans-serif"><text x="30" y="35" fill="#83dcc8" font-size="14" letter-spacing="2">CONCEPTUAL OVERVIEW</text><rect x="30" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(45,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><path d="M20 65 Q40 10 60 65 T100 65 T140 65 T180 65 T220 65"/><path d="M20 90 Q45 45 65 90 T110 90 T155 90 T200 90" opacity=".35"/></g><text x="165" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Time series + knowledge</text><text x="165" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Expert pairwise constraints</text><path d="M312 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="365" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(380,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><path d="M20 65 Q40 10 60 65 T100 65 T140 65 T180 65 T220 65"/><rect x="76" y="30" width="60" height="70" rx="8" fill="#83dcc8" fill-opacity=".12"/><path d="M82 63 Q98 110 116 70 L130 47" stroke-width="4"/></g><text x="500" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Learn a representation</text><text x="500" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">DTW-preserving shapelets</text><path d="M647 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="700" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(715,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><circle cx="35" cy="40" r="7" fill="#83dcc8" stroke="none"/><circle cx="64" cy="60" r="7" fill="#83dcc8" stroke="none"/><circle cx="48" cy="88" r="7" fill="#83dcc8" stroke="none"/><circle cx="90" cy="35" r="7" fill="#83dcc8" stroke="none"/><circle cx="153" cy="55" r="7" fill="#99b9ef" stroke="none"/><circle cx="190" cy="35" r="7" fill="#99b9ef" stroke="none"/><circle cx="186" cy="95" r="7" fill="#99b9ef" stroke="none"/><circle cx="215" cy="70" r="7" fill="#99b9ef" stroke="none"/></g><text x="835" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Cluster the representation</text><text x="835" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Incorporate expert knowledge</text><text x="30" y="343" fill="#a6b5c2" font-size="13">Illustrative schematic — not experimental results or a validated model architecture.</text></g></svg>
