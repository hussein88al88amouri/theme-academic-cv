<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc"><title id="title">Community Aware Coded Caching</title><desc id="desc">Conceptual overview of community-aware coded caching. This completed Lebanese University master’s project was supervised by Hussein El Amouri; the diagram does not assert a particular algorithm or performance result.</desc><rect width="1000" height="365" rx="16" fill="#111c27"/><g font-family="system-ui,sans-serif"><text x="30" y="35" fill="#83dcc8" font-size="14" letter-spacing="2">CONCEPTUAL OVERVIEW</text><rect x="30" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(45,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><path d="M35 40 64 60 48 88 M35 40 90 35 64 60 M153 55 190 35 215 70 186 95 153 55" opacity=".4"/><circle cx="35" cy="40" r="7" fill="#83dcc8" stroke="none"/><circle cx="64" cy="60" r="7" fill="#83dcc8" stroke="none"/><circle cx="48" cy="88" r="7" fill="#83dcc8" stroke="none"/><circle cx="90" cy="35" r="7" fill="#83dcc8" stroke="none"/><circle cx="153" cy="55" r="7" fill="#99b9ef" stroke="none"/><circle cx="190" cy="35" r="7" fill="#99b9ef" stroke="none"/><circle cx="186" cy="95" r="7" fill="#99b9ef" stroke="none"/><circle cx="215" cy="70" r="7" fill="#99b9ef" stroke="none"/></g><text x="165" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">User communities</text><text x="165" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Relationships between users</text><path d="M312 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="365" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(380,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><rect x="45" y="30" width="40" height="30" rx="5" fill="#83dcc8" fill-opacity="0.12"/><rect x="45" y="70" width="40" height="30" rx="5" fill="#83dcc8" fill-opacity="0.27"/><rect x="95" y="30" width="40" height="30" rx="5" fill="#83dcc8" fill-opacity="0.27"/><rect x="95" y="70" width="40" height="30" rx="5" fill="#83dcc8" fill-opacity="0.12"/><rect x="145" y="30" width="40" height="30" rx="5" fill="#83dcc8" fill-opacity="0.12"/><rect x="145" y="70" width="40" height="30" rx="5" fill="#83dcc8" fill-opacity="0.27"/></g><text x="500" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Caching</text><text x="500" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Content stored close to users</text><path d="M647 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="700" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(715,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><rect x="90" y="30" width="60" height="40" rx="8"/><path d="M120 70v20 M45 90h150 M45 90v20 M120 90v20 M195 90v20"/><rect x="25" y="110" width="40" height="20" rx="4"/><rect x="100" y="110" width="40" height="20" rx="4"/><rect x="175" y="110" width="40" height="20" rx="4"/></g><text x="835" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Coded delivery</text><text x="835" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Shared communication</text><text x="30" y="343" fill="#a6b5c2" font-size="13">Illustrative schematic — not experimental results or a validated model architecture.</text></g></svg>
