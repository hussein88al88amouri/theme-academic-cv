<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc"><title id="title">Neural vocoders beyond training conditions</title><desc id="desc">Training data are split to control seen and unseen pitch values, and different vocoder families are evaluated for extrapolation beyond their training conditions.</desc><rect width="1000" height="365" rx="16" fill="#111c27"/><g font-family="system-ui,sans-serif"><text x="30" y="35" fill="#83dcc8" font-size="14" letter-spacing="2">CONCEPTUAL OVERVIEW</text><rect x="30" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(45,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><rect x="35" y="25" width="105" height="83" rx="8" fill="#83dcc8" fill-opacity=".12"/><path d="M22 110h205 M140 20v95"/><text x="80" y="65" text-anchor="middle" font-size="20" fill="#e9eff3" stroke="none">seen</text><text x="188" y="65" text-anchor="middle" font-size="18" fill="#e9eff3" stroke="none">unseen</text></g><text x="165" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Control training conditions</text><text x="165" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Seen and unseen pitch ranges</text><path d="M312 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="365" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(380,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><path d="M20 65 Q40 10 60 65 T100 65 T140 65 T180 65 T220 65"/><path d="M20 90 Q45 45 65 90 T110 90 T155 90 T200 90" opacity=".35"/></g><text x="500" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Compare vocoder families</text><text x="500" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Autoregressive / filter / flow / GAN</text><path d="M647 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="700" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(715,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><rect x="40" y="20" width="160" height="100" rx="10"/><path d="m60 43 7 7 12-16 M94 42h80 m-114 26 7 7 12-16 M94 67h80 m-114 26 7 7 12-16 M94 92h80"/></g><text x="835" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Evaluate extrapolation</text><text x="835" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Behavior on unseen pitch values</text><text x="30" y="343" fill="#a6b5c2" font-size="13">Illustrative schematic — not experimental results or a validated model architecture.</text></g></svg>
