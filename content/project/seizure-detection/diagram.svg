<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc"><title id="title">Seizure detection with limited labels</title><desc id="desc">The collaboration with LAU explores diffusion-based and few-shot learning for seizure detection with limited labels. This is a high-level concept, not the manuscript’s model architecture.</desc><rect width="1000" height="365" rx="16" fill="#111c27"/><g font-family="system-ui,sans-serif"><text x="30" y="35" fill="#83dcc8" font-size="14" letter-spacing="2">CONCEPTUAL OVERVIEW</text><rect x="30" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(45,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><path d="M20 65 Q40 10 60 65 T100 65 T140 65 T180 65 T220 65"/><path d="M20 90 Q45 45 65 90 T110 90 T155 90 T200 90" opacity=".35"/></g><text x="165" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Time-series signals</text><text x="165" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Limited labeled examples</text><path d="M312 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="365" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(380,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><path d="m25 50 55 35 55-35 65 35 M25 90l55-35 55 35 65-35" opacity=".4"/><circle cx="25" cy="50" r="10" fill="#182632"/><circle cx="25" cy="90" r="10" fill="#182632"/><circle cx="80" cy="55" r="10" fill="#182632"/><circle cx="80" cy="85" r="10" fill="#182632"/><circle cx="135" cy="50" r="10" fill="#182632"/><circle cx="135" cy="90" r="10" fill="#182632"/><circle cx="200" cy="55" r="10" fill="#182632"/><circle cx="200" cy="85" r="10" fill="#182632"/></g><text x="500" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Learning approaches</text><text x="500" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Diffusion + few-shot learning</text><path d="M647 186h40m-10-8 10 8-10 8" fill="none" stroke="#83dcc8" stroke-width="2"/><rect x="700" y="65" width="270" height="245" rx="14" fill="#182632" stroke="#2a3b49"/><g transform="translate(715,85)" fill="none" stroke="#83dcc8" stroke-width="2.5"><rect x="30" y="25" width="180" height="90" rx="14"/><path d="M43 73h37l15-28 22 57 16-29h64"/></g><text x="835" y="258" text-anchor="middle" fill="#e9eff3" font-size="18" font-weight="600">Seizure detection</text><text x="835" y="287" text-anchor="middle" fill="#a6b5c2" font-size="13">Ongoing research with LAU</text><text x="30" y="343" fill="#a6b5c2" font-size="13">Illustrative schematic — not experimental results or a validated model architecture.</text></g></svg>
